name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Surge SPA fallback
        run: cp dist/adeelzahid-portfolio/browser/index.html dist/adeelzahid-portfolio/browser/200.html

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/adeelzahid-portfolio/browser
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Surge
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "Add repo secret SURGE_TOKEN (Settings → Secrets and variables → Actions)."
            echo "Create a token locally with: npx surge token"
            exit 1
          fi
          ls -la ./dist
          npm install --global surge
          surge ./dist adeelzahid.surge.sh --token "$SURGE_TOKEN"
