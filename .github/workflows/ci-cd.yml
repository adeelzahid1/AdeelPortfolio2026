name: Build and Deploy to Surge

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app (Production)
        run: npm run build

      - name: Copy index.html to 200.html (for client-side routing)
        run: cp dist/adeelzahid-portfolio/browser/index.html dist/adeelzahid-portfolio/browser/200.html

      - name: Deploy to Surge
        run: npx surge dist/adeelzahid-portfolio/browser adeelzahid-portfolio.surge.sh --token ${{ secrets.SURGE_TOKEN }}
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
