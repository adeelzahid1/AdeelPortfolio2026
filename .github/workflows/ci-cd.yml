name: CI / Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Surge SPA fallback
        run: |
          SITE=dist/adeelzahid-portfolio/browser
          test -f "$SITE/index.html"
          cp "$SITE/index.html" "$SITE/200.html"
          ls -la "$SITE"

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/adeelzahid-portfolio/browser
          retention-days: 7

      - name: Deploy to Surge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_TOKEN" ]; then
            echo "Add repo secret SURGE_TOKEN (Settings → Secrets and variables → Actions)."
            echo "Create a token locally with: npx surge token"
            exit 1
          fi
          SITE=dist/adeelzahid-portfolio/browser
          test -f "$SITE/index.html"
          npm install --global surge
          surge "$SITE" adeelzahid.surge.sh --token "$SURGE_TOKEN"
